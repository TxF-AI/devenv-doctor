name: Feature request / Proposer une fonctionnalité
description: An idea to improve DevEnv Doctor (English or French).
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Which concrete situation is a problem for you today?
      placeholder: "When I install several Python versions, I have to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working (interface, behavior)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Current workarounds, other tools.
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - User PATH (HKCU)
        - System PATH (HKLM)
        - Environment variables
        - Profiles / export
        - Interface
        - Other
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I understand that any Registry write must stay preceded by a preview, a confirmation and a backup.
