name: Bug report / Signaler un bug
description: Quelque chose ne marche pas comme prévu dans DevEnv Doctor.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler le problème. **Ne colle ni mot de passe, ni jeton, ni nom d'utilisateur Windows** dans les logs ou les captures (masque-les).
  - type: input
    id: app-version
    attributes:
      label: Version de DevEnv Doctor
      description: Indiquée dans le titre de la fenêtre ou sur la page de la Release.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Version de Windows
      description: "Commande `winver`, ou `[Environment]::OSVersion` dans PowerShell."
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: true
  - type: dropdown
    id: privileges
    attributes:
      label: Lancé en administrateur ?
      description: Modifier le PATH Système (HKLM) demande les droits administrateur.
      options:
        - Non
        - Oui
        - Je ne sais pas
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Zone concernée
      options:
        - Analyse du PATH (orphelins, doublons, conflits)
        - Nettoyage / compression / réordonnancement
        - Sauvegarde / restauration
        - Profils / export JSON / export PowerShell
        - Interface
        - Autre
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir l'onglet PATH
        2. Cliquer sur « Orphelins »
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, message d'erreur, captures d'écran
      description: "Glisse les images ici. Les sauvegardes JSON contiennent tes chemins (ne les joins qu'après relecture)."
