name: Bug report / Signaler un bug
description: Something does not work as expected in DevEnv Doctor (English or French).
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting the problem. **Do not paste passwords, tokens or your Windows user name** in logs or screenshots (redact them).
  - type: input
    id: app-version
    attributes:
      label: DevEnv Doctor version
      description: Shown in the window title or on the Release page.
      placeholder: "0.3.1"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Windows version
      description: "Run `winver`, or `[Environment]::OSVersion` in PowerShell."
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: true
  - type: dropdown
    id: privileges
    attributes:
      label: Run as administrator?
      description: Changing the System PATH (HKLM) requires administrator rights.
      options:
        - "No"
        - "Yes"
        - I don't know
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PATH analysis (orphans, duplicates, conflicts)
        - Cleanup / compression / reordering
        - Backup / restore
        - Profiles / JSON export / PowerShell export
        - Interface
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the PATH tab
        2. Click "Orphans"
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, error message, screenshots
      description: "Drop images here. JSON backups contain your paths (attach them only after reviewing)."
