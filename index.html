<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevEnv Doctor</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-200 font-mono">
    <main class="mx-auto max-w-4xl p-6">
      <h1 class="text-2xl font-bold text-fuchsia-400 tracking-widest">DEVENV DOCTOR</h1>
      <p class="text-sm text-zinc-500 mb-4">Analyse du %PATH% depuis le Registre (lecture seule)</p>

      <div id="counters" class="mb-4 grid grid-cols-2 gap-2 sm:grid-cols-4 text-center"></div>

      <div role="tablist" class="mb-3 flex gap-2">
        <button id="tab-user" role="tab" data-scope="user"></button>
        <button id="tab-system" role="tab" data-scope="system"></button>
      </div>
      <div id="meta" class="mb-3 text-xs text-zinc-500"></div>
      <ul id="entries" class="space-y-2"></ul>
    </main>
  </body>
</html>
